<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Pet Palace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container" style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc;">
        <h2>Pet Palace Login</h2>
        <form action="/login" method="POST">
            <div style="margin-bottom: 10px;">
                <label>Username:</label><br>
                <input type="text" name="username" style="width: 100%;" required>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Password:</label><br>
                <input type="password" name="password" style="width: 100%;" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
        <p>No account? <a href="signup.html">Sign up here</a></p>
    </div>
</body>
</html>
