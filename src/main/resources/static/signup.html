<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Pet Palace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body id="signup-page">

    <main class="auth-container">
        <div class="auth-box">
            <h2>Create Your Account</h2>
            
            <form id="signup-form">
                <p>
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="rence_escala" required minlength="8" maxlength="20">
                </p>
                <p>
                    <label for="pass">Password</label>
                    <input type="password" id="pass" placeholder="Enter secure password" required minlength="8">
                </p>

                <p class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the Terms & Conditions</label>
                </p>

                <button type="submit" class="btn-auth">Sign Up</button>
            </form>
            
            <p class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </div>
    </main>

    <script>
        const signupForm = document.getElementById('signup-form');
        if (signupForm) {
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Task 2.1: Prepare user data for API
                const userData = {
                    username: document.getElementById('username').value,
                    password: document.getElementById('pass').value,
                    role: "ROLE_USER" // Default role
                };

                try {
                    // Task 2.1: Actual POST request to backend
                    const response = await fetch('/api/v1/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });

                    if (response.ok) {
                        // Task 2.1: Success handling
                        alert("Account created successfully for " + userData.username + "!");
                        window.location.href = 'login.html'; // Redirect to Login page
                    } else {
                        // Task 5: Handle Validation Errors from GlobalExceptionHandler
                        const errorData = await response.json();
                        alert("Registration Failed: " + JSON.stringify(errorData));
                    }
                } catch (error) {
                    console.error("Connection error:", error);
                    alert("Cannot connect to server. Is the backend running?");
                }
            });
        }
    </script>

</body>
</html>
